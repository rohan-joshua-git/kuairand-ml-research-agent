# Autonomous ML Research Agent — configuration
#
# Values marked "PLACEHOLDER — pending Starter Kit" are unknown until the
# organizers hand over the official baseline, eval script, candidate-set
# definition, and convergence/budget rules. Everything that depends on them
# is isolated here (or reads from here) so the rest of the codebase never
# hardcodes an assumption.

dataset:
  name: kuairand-pure
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  # Date-based split fixed by the challenge brief.
  train_range: ["2022-04-08", "2022-04-21"]
  val_range:   ["2022-04-22", "2022-04-30"]   # first half of 4/22-5/08
  test_range:  ["2022-05-01", "2022-05-08"]   # second half of 4/22-5/08 (HIDDEN — never touch during dev)
  logs:
    standard_train: "log_standard_4_08_to_4_21_pure.csv"
    standard_evalset: "log_standard_4_22_to_5_08_pure.csv"
    random_unbiased: "log_random_4_22_to_5_08_pure.csv"   # Play 1 — see referee.py
  supplements:
    captions: "kuairand_video_captions.csv"      # Zenodo supplement — gate on organizer confirmation
    categories: "kuairand_video_categories.csv"  # Zenodo supplement — gate on organizer confirmation

# PLACEHOLDER — pending Starter Kit answers. Do not trust these for a final
# hidden-test submission until confirmed by organizers. See README "Open
# Questions" section.
starter_kit:
  candidate_set: "unknown"       # "impressed_set" | "all_items" — changes NDCG@10/Recall@50 semantics
  epsilon: 0.001                 # convergence: min improvement to not count as "plateaued"
  patience_n: 5                  # convergence: iterations without improvement before stopping
  compute_budget_gpu_hours: null # unknown
  token_budget: null             # unknown
  submission_schema_path: null   # unknown — pipeline/submit.py raises until this is set

# Play 1 (Unbiased Referee) — Tier A/B toggle depends on organizer answer to
# "is log_random permitted for training, propensity-only, or not at all?"
referee:
  mode: "tier_b"   # "tier_a" = train directly on random log | "tier_b" = propensity/diagnostics only | "disabled"
  divergence_alert_threshold: 0.05   # biased-vs-unbiased score gap that triggers a reflect+revise flag

compression_gate:
  enabled: true
  reproducer_uses_short_prompt: true
  max_prompt_tokens: 800   # deliberately terse — see agent/compression_gate.py

agent:
  llm:
    iteration_model: "claude-sonnet-5"   # cheap, high-volume: writes code diffs, runs ablations
    reflection_model: "claude-opus-5"    # expensive, low-volume: ideation, reflect+revise, final report synthesis
  max_iterations: 40
  skill_store:
    tier1_path: "./agent/skill_store/tier1_core.md"
    tier2_path: "./agent/skill_store/tier2_domain.md"
    tier3_dir: "./agent/skill_store/tier3_deep"

logging:
  run_log_dir: "./logs"
  intervention_log: "./logs/interventions.jsonl"
  resource_usage_report: "./logs/resource_usage.json"
