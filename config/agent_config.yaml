# Autonomous ML Research Agent — configuration
#
# All values below are confirmed against the organizer-provided KuaiRand-Pure
# Starter Kit, vendored verbatim in ./starter_kit/ (see starter_kit/README.md
# and starter_kit/baseline_scores.json). Nothing here is a placeholder anymore.

dataset:
  name: kuairand-pure
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  # Date-based split, fixed by the Starter Kit (starter_kit/data.py SPLITS).
  train_range: ["2022-04-08", "2022-04-21"]   # 1,141,112 rows
  val_range:   ["2022-04-22", "2022-04-28"]   # 124,909 rows
  test_range:  ["2022-04-29", "2022-05-08"]   # 170,588 rows (HIDDEN — never touch during dev)
  label: "long_view"   # positive relevance label — NOT is_click, see starter_kit/data.py LABEL
  logs:
    standard_train: "log_standard_4_08_to_4_21_pure.csv"
    standard_evalset: "log_standard_4_22_to_5_08_pure.csv"
    random_unbiased: "log_random_4_22_to_5_08_pure.csv"   # Play 1 — see referee.py; confirmed by
    # Starter Kit README as legitimate for EXTRA VALIDATION ONLY, never training (priority item 7).
  features:
    video_basic: "video_features_basic_pure.csv"          # has author_id — used by the official baseline
    video_statistic: "video_features_statistic_pure.csv"  # LEAKY — see leakage_guard.py, drop by default
    user_features: "user_features_pure.csv"
  supplements:
    captions: "kuairand_video_captions.csv"      # Zenodo supplement — gate on organizer confirmation
    categories: "kuairand_video_categories.csv"  # Zenodo supplement — gate on organizer confirmation

# Confirmed from starter_kit/baseline_scores.json and starter_kit/README.md.
starter_kit:
  candidate_set: "impressed_set"   # confirmed: "each user is ranked only within their own rows
                                    # in the eval split" — starter_kit/README.md "Task definition"
  metrics: ["GAUC", "nDCG@5"]      # primary = mean(GAUC, nDCG@5) — see pipeline/evaluate.py
  epsilon: 0.002                   # convergence: min primary improvement to not count as "plateaued"
                                    # (~2.5x the baseline's 5-seed std of 0.0008)
  patience_n: 3                    # convergence: iterations without improvement before stopping
  max_iterations_cap: 50           # hard cap (usually ε/N triggers first)
  wall_clock_ceiling_hours: 6      # backstop; compute is cheap — official baseline is ~40s CPU
  compute_budget_gpu_hours: null   # not capped — GPU-hours reported for Feasibility scoring only
  token_budget: null               # not capped — tokens reported for Feasibility scoring only
  submission_schema_path: "./starter_kit/submit.py"  # row_id,user_id,video_id,score — see that module
  official_baseline:
    # starter_kit/baseline_scores.json "fm_official" — reproduced locally, test primary landed at
    # 0.5953 vs published 0.5946 (within the 0.0008 seed std). This is the score the agent must beat.
    valid: {GAUC: 0.6674, nDCG_at_5: 0.5357, primary: 0.6016}
    test:  {GAUC: 0.6610, nDCG_at_5: 0.5282, primary: 0.5946}
  oracle_ceiling:
    # Judge headroom against this, not against 1.0 — 27.1% of test users are all-negative
    # (nDCG=0 for any model) and 9.2% are all-positive. See starter_kit/README.md.
    test: {GAUC: 1.0, nDCG_at_5: 0.7289, primary: 0.8645}

# Play 1 (Unbiased Referee) — the Starter Kit README explicitly confirms this file's
# sanctioned use: "extra validation (not training)" (priority item 7). tier_a (training
# on it) is therefore NOT sanctioned; keep this at tier_b.
referee:
  mode: "tier_b"   # "tier_a" = train directly on random log (NOT sanctioned, do not use) |
                    # "tier_b" = propensity/diagnostics/extra-validation only (confirmed) | "disabled"
  divergence_alert_threshold: 0.05   # biased-vs-unbiased primary-score gap that triggers a reflect+revise flag

compression_gate:
  enabled: true
  reproducer_uses_short_prompt: true
  max_prompt_tokens: 800   # deliberately terse — see agent/compression_gate.py

agent:
  llm:
    # "anthropic" | "gemini" — either is fine, the challenge is provider-agnostic
    # ("use whatever [LLM] you like"). Gemini's free tier (Flash models, no
    # billing required) is a genuinely free way to validate the loop before
    # spending on the Anthropic API, which needs a funded account for any call
    # at all. See agent/llm_client.py for both backends.
    provider: "gemini"
    anthropic:
      iteration_model: "claude-sonnet-5"   # cheap, high-volume: writes code diffs, runs ablations
      reflection_model: "claude-opus-5"    # expensive, low-volume: ideation, reflect+revise, final report synthesis
    gemini:
      # Free tier covers Flash/Flash-Lite only (Pro requires billing), so
      # there's no cheap/expensive split to make the way Sonnet/Opus gives
      # you — both roles point at the same Flash model.
      iteration_model: "gemini-3.6-flash"   # verified working against this account 2026-08-30; 3.7-flash returned 503 (overloaded/not yet rolled out)
      reflection_model: "gemini-3.6-flash"
      # Free-tier quota buckets are per-model; when the primary's daily quota
      # exhausts mid-run, llm_client fails over down this list autonomously
      # instead of dying (verified live 2026-08-31: 3.6-flash returned 429
      # while both of these still answered).
      fallback_models: ["gemini-3.5-flash", "gemini-3.5-flash-lite"]
  max_iterations: 50   # matches starter_kit.max_iterations_cap; convergence (epsilon/patience_n) usually stops first
  skill_store:
    tier1_path: "./agent/skill_store/tier1_core.md"
    tier2_path: "./agent/skill_store/tier2_domain.md"
    tier3_dir: "./agent/skill_store/tier3_deep"

logging:
  run_log_dir: "./logs"
  intervention_log: "./logs/interventions.jsonl"
  resource_usage_report: "./logs/resource_usage.json"
